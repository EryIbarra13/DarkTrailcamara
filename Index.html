<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Scare Cam AR</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;width:100vw;height:100vh;touch-action:none}

    #splash{position:fixed;inset:0;z-index:100;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:2rem;text-align:center;transition:opacity .5s}
    #splash.hidden{opacity:0;pointer-events:none}
    #splash h1{font-size:clamp(1.8rem,7vw,2.4rem);color:#ff2222;text-shadow:0 0 24px #ff000077;letter-spacing:.06em}
    #splash p{color:#999;font-size:.9rem;max-width:300px;line-height:1.6}
    .img-frame{border:2px solid #ff2222;border-radius:10px;padding:6px;box-shadow:0 0 20px #ff000044;width:110px;height:138px;overflow:hidden;flex-shrink:0}
    .img-frame img{width:100%;height:100%;object-fit:cover;border-radius:6px}
    #start-btn{background:#cc0000;color:#fff;border:none;border-radius:8px;padding:14px 36px;font-size:1rem;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 0 20px #ff000055;width:100%;max-width:280px}
    #start-btn:active{background:#ff1111;transform:scale(.97)}

    /* Cámara */
    #cam-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:none}
    #cam-video.active{display:block}

    /* Canvas AR encima de la cámara */
    #ar-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;display:none;pointer-events:none}
    #ar-canvas.active{display:block}

    /* HUD */
    #hud{position:fixed;bottom:28px;left:0;right:0;z-index:10;display:none;justify-content:center;pointer-events:none}
    #hud.visible{display:flex}
    #hud-pill{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 20px;font-size:13px;color:#ccc;backdrop-filter:blur(6px);transition:all .3s}
    #hud-pill.found{color:#ff4444;border-color:rgba(255,68,68,.3)}

    /* Visor de enfoque */
    #viewfinder{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;display:none;width:65vw;max-width:260px;aspect-ratio:0.792}
    #viewfinder.active{display:block}
    #viewfinder svg{width:100%;height:100%}

    #error-msg{display:none;position:fixed;inset:0;z-index:200;background:#0a0a0a;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:2rem;text-align:center}
    #error-msg.visible{display:flex}
    #error-msg h2{color:#ff2222;font-size:1.3rem}
    #error-msg p{color:#999;font-size:.9rem;max-width:280px;line-height:1.6}
    #error-msg button{background:#cc0000;color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:.95rem;cursor:pointer}

    #dbg{position:fixed;top:8px;left:8px;z-index:99;font-size:11px;color:#0f0;background:rgba(0,0,0,.8);padding:4px 8px;border-radius:4px;font-family:monospace;display:none;max-width:95vw;line-height:1.5}
  </style>
</head>
<body>

<div id="splash">
  <h1>💀 SCARE CAM AR</h1>
  <p>Apunta la cámara a esta imagen y espera</p>
  <div class="img-frame"><img id="img-preview" alt="marcador"/></div>
  <p style="font-size:11px;color:#666">Mantén la imagen completa dentro del visor</p>
  <button id="start-btn">🎃 Iniciar</button>
</div>

<div id="error-msg">
  <h2>⚠️ Sin acceso a cámara</h2>
  <p>Permite el acceso a la cámara y recarga la página.</p>
  <button onclick="location.reload()">Reintentar</button>
</div>

<video id="cam-video" autoplay playsinline muted></video>
<canvas id="ar-canvas"></canvas>

<!-- Visor que guía al usuario a enfocar la imagen -->
<div id="viewfinder">
  <svg viewBox="0 0 100 126" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="98" height="124" rx="4" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- Esquinas -->
    <path d="M1 20 L1 1 L20 1" stroke="#ff2222" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M80 1 L99 1 L99 20" stroke="#ff2222" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1 106 L1 125 L20 125" stroke="#ff2222" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M80 125 L99 125 L99 106" stroke="#ff2222" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
</div>

<div id="hud"><div id="hud-pill">Centra la imagen en el visor 👁️</div></div>
<div id="dbg"></div>

<video id="horror-src" loop playsinline muted
  style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none"></video>

<script>
const IMG_B64="goku.jpg";
const VIDEO_B64="animacion.mp4"
const DEBUG = location.search.includes('debug');
const dbg   = document.getElementById('dbg');
if (DEBUG) dbg.style.display='block';

const splash     = document.getElementById('splash');
const hud        = document.getElementById('hud');
const hudPill    = document.getElementById('hud-pill');
const errorMsg   = document.getElementById('error-msg');
const camVideo   = document.getElementById('cam-video');
const arCanvas   = document.getElementById('ar-canvas');
const horrorSrc  = document.getElementById('horror-src');
const viewfinder = document.getElementById('viewfinder');
const ctx        = arCanvas.getContext('2d', { alpha:true });

document.getElementById('img-preview').src = IMG_B64;
horrorSrc.src = VIDEO_B64;

let active=false, detected=false;
let sX=0,sY=0,sW=0,sH=0;
const LERP=0.12;
let missCount=0;
const MISS_MAX=6;
let videoAlpha=0;

// ── Proporción de la imagen ──
const IMG_W=900, IMG_H=1157, IMG_RATIO=IMG_W/IMG_H; // 0.778

// ── Estrategia: comparar SOLO la región del visor ──
// En lugar de sliding window, el visor guía al usuario a colocar la imagen
// exactamente donde esperamos. Comparamos esa región fija contra la referencia.
// Esto es O(1) en lugar de O(n²) — mucho más rápido en móvil.

// Tamaño del template de referencia
const TW=48, TH=60;
const refCanvas=document.createElement('canvas');
refCanvas.width=TW; refCanvas.height=TH;
const refCtx=refCanvas.getContext('2d',{willReadFrequently:true});

// Múltiples templates: imagen completa + parches clave
const TEMPLATE_REGIONS = [
  {x:0,    y:0,    w:1,    h:1   },  // imagen completa
  {x:0.20, y:0.20, w:0.40, h:0.20},  // zona central alta varianza
  {x:0.60, y:0.20, w:0.20, h:0.20},  // zona derecha
  {x:0.60, y:0.40, w:0.20, h:0.20},  // zona derecha media
  {x:0.10, y:0.00, w:0.80, h:0.20},  // zona superior
  {x:0.20, y:0.50, w:0.60, h:0.25},  // zona inferior
];

const refImg=new Image();
refImg.src=IMG_B64;
let templates=null;

refImg.onload=()=>{
  // Generar templates a 3 niveles de brillo: normal, más claro (+60%), más oscuro (-30%)
  // Así el matching funciona sin importar si la imagen se ve en pantalla brillante o impresa
  const brightnessLevels = [1.0, 1.6, 0.7];
  templates = [];
  TEMPLATE_REGIONS.forEach(r=>{
    brightnessLevels.forEach(brt=>{
      refCtx.clearRect(0,0,TW,TH);
      // Dibujar parche
      refCtx.drawImage(refImg,
        r.x*refImg.naturalWidth, r.y*refImg.naturalHeight,
        r.w*refImg.naturalWidth, r.h*refImg.naturalHeight,
        0,0,TW,TH);
      // Aplicar brillo con compositing
      if(brt!==1.0){
        const op = brt>1 ? 'lighter' : 'multiply';
        refCtx.globalCompositeOperation = brt>1 ? 'screen' : 'multiply';
        refCtx.globalAlpha = Math.abs(brt-1.0);
        refCtx.fillStyle = brt>1 ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.3)';
        refCtx.fillRect(0,0,TW,TH);
        refCtx.globalCompositeOperation='source-over';
        refCtx.globalAlpha=1;
      }
      templates.push(toGrayNorm(refCtx.getImageData(0,0,TW,TH).data, TW*TH));
    });
  });
  if(DEBUG) console.log('Templates listos:', templates.length);
};

// Canvas de trabajo
const WORK_W=240;
let WORK_H=180;
const workCanvas=document.createElement('canvas');
workCanvas.width=WORK_W;
const workCtx=workCanvas.getContext('2d',{willReadFrequently:true});

const winCanvas=document.createElement('canvas');
winCanvas.width=TW; winCanvas.height=TH;
const winCtx=winCanvas.getContext('2d',{willReadFrequently:true});

// ── Inicio ──
document.getElementById('start-btn').addEventListener('click', async()=>{
  if(!navigator.mediaDevices?.getUserMedia){errorMsg.classList.add('visible');return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}
    });
    camVideo.srcObject=stream;
    await camVideo.play();
    horrorSrc.load();
    horrorSrc.play().catch(()=>{});
    splash.classList.add('hidden');
    setTimeout(()=>splash.style.display='none',550);
    camVideo.classList.add('active');
    arCanvas.classList.add('active');
    viewfinder.classList.add('active');
    hud.classList.add('visible');
    active=true;
    resizeCanvas();
    requestAnimationFrame(loop);
  }catch(e){errorMsg.classList.add('visible');}
});

function resizeCanvas(){
  arCanvas.width=window.innerWidth;
  arCanvas.height=window.innerHeight;
}
window.addEventListener('resize',resizeCanvas);

// ── Calcular región del visor en coordenadas de pantalla ──
function getViewfinderRect(){
  const vfEl=document.getElementById('viewfinder');
  const r=vfEl.getBoundingClientRect();
  return {x:r.left, y:r.top, w:r.width, h:r.height};
}

let lastDetect=0;
const DETECT_MS=120;

function loop(ts){
  if(!active) return;
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,arCanvas.width,arCanvas.height);
  if(ts-lastDetect>DETECT_MS && templates && camVideo.readyState>=2){
    lastDetect=ts; detect();
  }
  if(detected) videoAlpha=Math.min(1,videoAlpha+0.08);
  else         videoAlpha=Math.max(0,videoAlpha-0.18);
  if(videoAlpha>0.01) renderVideo();
}

// ── Detección híbrida ──
// Modo 1 (no detectado): compara región del visor contra templates → rápido
// Modo 2 (detectado):    sliding window pequeño alrededor de última posición → seguimiento
function detect(){
  const vw=camVideo.videoWidth||camVideo.clientWidth;
  const vh=camVideo.videoHeight||camVideo.clientHeight;
  if(!vw||!vh) return;

  WORK_H=Math.round(WORK_W*vh/vw);
  workCanvas.height=WORK_H;
  workCtx.drawImage(camVideo,0,0,WORK_W,WORK_H);

  let bestScore=0, bestX=0, bestY=0, bestWW=0, bestWH=0;

  if(!detected){
    // ── Modo búsqueda: buscar en toda la imagen con sliding window liviano ──
    const scales=[0.30,0.45,0.62,0.80];
    const step=0.12;
    for(const sc of scales){
      const ww=Math.round(WORK_W*sc);
      const wh=Math.round(ww/IMG_RATIO);
      if(wh>WORK_H) continue;
      const sx2=Math.max(3,Math.round(ww*step));
      const sy2=Math.max(3,Math.round(wh*step));
      for(let py=0;py+wh<=WORK_H;py+=sy2){
        for(let px=0;px+ww<=WORK_W;px+=sx2){
          const score=scoreWindow(px,py,ww,wh);
          if(score>bestScore){bestScore=score;bestX=px;bestY=py;bestWW=ww;bestWH=wh;}
        }
      }
    }
  } else {
    // ── Modo seguimiento: solo buscar cerca de la última posición ──
    const sx2=window.innerWidth/WORK_W;
    const sy2=window.innerHeight/WORK_H;
    const lastPX=sX/sx2, lastPY=sY/sy2, lastPW=sW/sx2, lastPH=sH/sy2;
    const margin=0.15;
    const scales=[lastPW/WORK_W*0.85, lastPW/WORK_W, lastPW/WORK_W*1.15];
    for(const sc of scales){
      const ww=Math.round(WORK_W*sc);
      const wh=Math.round(ww/IMG_RATIO);
      if(wh>WORK_H) continue;
      const x0=Math.max(0,Math.round(lastPX-lastPW*margin));
      const x1=Math.min(WORK_W-ww,Math.round(lastPX+lastPW*margin));
      const y0=Math.max(0,Math.round(lastPY-lastPH*margin));
      const y1=Math.min(WORK_H-wh,Math.round(lastPY+lastPH*margin));
      const step3=Math.max(2,Math.round(ww*0.08));
      for(let py=y0;py<=y1;py+=step3){
        for(let px=x0;px<=x1;px+=step3){
          const score=scoreWindow(px,py,ww,wh);
          if(score>bestScore){bestScore=score;bestX=px;bestY=py;bestWW=ww;bestWH=wh;}
        }
      }
    }
  }

  if(DEBUG) dbg.textContent=`score:${bestScore.toFixed(3)} detected:${detected} miss:${missCount}`;

  const DETECT_TH = detected ? 0.30 : 0.35;
  const LOSE_TH   = 0.22;
  const scX=window.innerWidth/WORK_W;
  const scY=window.innerHeight/WORK_H;

  if(bestScore>=DETECT_TH){
    missCount=0;
    const tx=bestX*scX,ty=bestY*scY,tw=bestWW*scX,th=bestWH*scY;
    if(!detected){
      sX=tx;sY=ty;sW=tw;sH=th;
      horrorSrc.currentTime=0;
      horrorSrc.play().catch(()=>{});
      hudPill.textContent='👻';
      hudPill.classList.add('found');
      viewfinder.style.opacity='0';
      detected=true;
    } else {
      sX+=(tx-sX)*LERP;sY+=(ty-sY)*LERP;
      sW+=(tw-sW)*LERP;sH+=(th-sH)*LERP;
    }
  } else if(detected){
    if(bestScore<LOSE_TH){
      missCount++;
      if(missCount>=MISS_MAX){
        detected=false;missCount=0;
        horrorSrc.pause();
        hudPill.textContent='Centra la imagen en el visor 👁️';
        hudPill.classList.remove('found');
        viewfinder.style.opacity='1';
      }
    } else { missCount=0; }
  }
}

// Puntuar una ventana contra todos los templates
function scoreWindow(px,py,ww,wh){
  const BRT=3; // niveles de brillo por region
  let total=0, count=0;
  for(let ri=0;ri<TEMPLATE_REGIONS.length;ri++){
    const r=TEMPLATE_REGIONS[ri];
    const zx=px+Math.round(r.x*ww);
    const zy=py+Math.round(r.y*wh);
    const zw=Math.max(2,Math.round(r.w*ww));
    const zh=Math.max(2,Math.round(r.h*wh));
    if(zx+zw>WORK_W||zy+zh>WORK_H) continue;
    winCtx.drawImage(workCanvas,zx,zy,zw,zh,0,0,TW,TH);
    const gray=toGrayNorm(winCtx.getImageData(0,0,TW,TH).data,TW*TH);
    // Tomar el MEJOR score entre los 3 niveles de brillo del template
    let best=-1;
    for(let b=0;b<BRT;b++){
      const s=ncc(templates[ri*BRT+b], gray);
      if(s>best) best=s;
    }
    total+=best; count++;
  }
  return count>0 ? total/count : 0;
}

function renderVideo(){
  if(horrorSrc.readyState<2) return;
  // Anclar al viewfinder: usar su posición y tamaño fijos
  const vfEl = document.getElementById('viewfinder');
  const vfR  = vfEl.getBoundingClientRect();
  const fx = vfR.left, fy = vfR.top, fw = vfR.width, fh = vfR.height;

  const vw=horrorSrc.videoWidth||1920;
  const vh=horrorSrc.videoHeight||1080;
  // Cover: escalar para llenar el viewfinder sin barras
  const scale=Math.max(fw/vw, fh/vh);
  const dw=vw*scale, dh=vh*scale;
  const dx=fx+(fw-dw)*0.5;
  const dy=fy+(fh-dh)*0.5;

  ctx.save();
  ctx.globalAlpha=videoAlpha;
  ctx.beginPath();
  ctx.rect(fx, fy, fw, fh);
  ctx.clip();
  ctx.drawImage(horrorSrc, dx, dy, dw, dh);
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function toGrayNorm(data,n){
  const g=new Float32Array(n);
  let sum=0;
  for(let i=0;i<n;i++){g[i]=0.299*data[i*4]+0.587*data[i*4+1]+0.114*data[i*4+2];sum+=g[i];}
  const mean=sum/n;
  let v=0;for(let i=0;i<n;i++){g[i]-=mean;v+=g[i]*g[i];}
  const std=Math.sqrt(v/n)||1;
  for(let i=0;i<n;i++) g[i]/=std;
  return g;
}

function ncc(a,b){
  let s=0;for(let i=0;i<a.length;i++) s+=a[i]*b[i];
  return s/a.length;
}
</script>
</body>
</html>
